# Base stack: PostgreSQL 18 + the API.
#
#   docker compose up -d              -> base + docker-compose.override.yml (dev)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   (VPS)
#
# PostgreSQL 18 NOTE: the official image moved PGDATA to
# /var/lib/postgresql/18/docker and the VOLUME to /var/lib/postgresql.
# Mounting a volume at the old /var/lib/postgresql/data path silently loses
# data (or fails to start), so the volume below targets /var/lib/postgresql.

services:
  postgres:
    image: postgres:18-alpine
    container_name: closet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # publish the container so host-run alembic / uvicorn can reach it.
      # host 5432 -> container 5432. If a native PostgreSQL already occupies
      # host 5432, either stop it, or change the host side here to 5433 and
      # set POSTGRES_PORT=5433 in .env.dev.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_closet:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [closet_net]

  # S3-compatible object storage for media (dev only). In prod, point
  # S3_* env vars at real AWS S3 / Cloudflare R2 and drop this service.
  minio:
    image: minio/minio:latest
    container_name: closet_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: <redacted>
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [closet_net]

  # one-shot: create the media bucket and make it publicly readable
  minio_init:
    image: minio/mc:latest
    container_name: closet_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-closet-media} &&
      mc anonymous set download local/${S3_BUCKET:-closet-media} &&
      echo 'bucket ready';
      "
    networks: [closet_net]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: closet_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # inside the network the database is reachable by service name
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # inside the network MinIO is reachable by service name
      S3_ENDPOINT_URL: http://minio:9000
    env_file:
      - ${ENV_FILE:-.env.dev}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [closet_net]

volumes:
  db_closet:
  minio_data:

networks:
  closet_net:
    driver: bridge